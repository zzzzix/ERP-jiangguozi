<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>供货管理 - 财务业务管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f1f5f9;color:#1e293b;font-size:14px}
#app{display:flex;min-height:100vh}

/* Sidebar */
#sidebar{width:220px;background:#1e293b;color:#cbd5e1;flex-shrink:0;position:fixed;height:100vh;overflow-y:auto;transition:transform .3s;z-index:100;display:flex;flex-direction:column}
.sidebar-header{padding:18px 16px;border-bottom:1px solid #334155}
.sidebar-header h1{font-size:15px;color:#fff;font-weight:700}
.sidebar-header p{font-size:11px;color:#64748b;margin-top:3px}
.sidebar-nav{padding:6px 0;flex:1}
.nav-section{margin-bottom:4px}
.nav-section-title{font-size:10px;color:#64748b;padding:8px 16px 2px;text-transform:uppercase;letter-spacing:.5px}
.nav-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;color:#cbd5e1;font-size:13px;transition:all .2s;border-left:3px solid transparent}
.nav-item:hover{background:#334155;color:#fff}
.nav-item.active{background:#1e3a5f;color:#fff;border-left-color:#2563eb}
.nav-item svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
.sidebar-footer{padding:12px 16px;border-top:1px solid #334155}
.sidebar-footer button{display:block;width:100%;margin-bottom:6px;padding:6px;border:1px solid #475569;background:#334155;color:#cbd5e1;border-radius:4px;font-size:11px;cursor:pointer}
.sidebar-footer button:hover{background:#475569;color:#fff}

/* Main */
#main{flex:1;margin-left:220px;min-height:100vh}

/* Topbar */
.topbar{background:#fff;padding:10px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;gap:10px;flex-wrap:wrap}
.company-filter{display:flex;align-items:center;gap:8px}
.company-filter label{font-size:13px;color:#64748b;white-space:nowrap}
.company-filter select{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#fff;max-width:240px}
.header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.header-actions .date-text{font-size:13px;color:#64748b}
.cloud-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:5px 10px;border:1px solid #2563eb;background:#eff6ff;color:#2563eb;border-radius:6px;cursor:pointer;font-family:inherit}
.cloud-btn:hover{background:#dbeafe}
.cloud-btn #cloudStatus{font-weight:600}

/* Buttons */
.btn{padding:7px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:#e2e8f0;color:#475569}
.btn-secondary:hover{background:#cbd5e1}
.btn-success{background:#16a34a;color:#fff}
.btn-success:hover{background:#15803d}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-warning{background:#f59e0b;color:#fff}
.btn-warning:hover{background:#d97706}
.btn-outline{background:transparent;border:1px solid #cbd5e1;color:#475569}
.btn-outline:hover{background:#f1f5f9}
.btn-sm{padding:3px 8px;font-size:11px}
.btn svg{width:14px;height:14px}

/* Content */
#content{padding:16px 20px}
.view{display:none}
.view.active{display:block}

/* Cards */
.card{background:#fff;border-radius:8px;padding:16px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:14px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* KPI */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi-card{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:4px solid #2563eb}
.kpi-card.profit{border-left-color:#16a34a}
.kpi-card.pending{border-left-color:#f59e0b}
.kpi-card.invoice{border-left-color:#8b5cf6}
.kpi-label{font-size:12px;color:#64748b;margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:700}
.kpi-sub{font-size:11px;color:#94a3b8;margin-top:3px}

/* Tables */
.table-wrap{overflow-x:auto}
table.data-table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
.data-table th{background:#f8fafc;padding:9px 10px;text-align:left;font-weight:600;color:#475569;border-bottom:2px solid #e2e8f0;white-space:nowrap;position:sticky;top:0}
.data-table td{padding:8px 10px;border-bottom:1px solid #f1f5f9}
.data-table tr:hover{background:#f8fafc}
.text-right{text-align:right}
.text-center{text-align:center}
.profit-text{color:#16a34a;font-weight:600}
.loss-text{color:#dc2626;font-weight:600}
.badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;display:inline-block}
.badge-blue{background:#dbeafe;color:#1e40af}
.badge-green{background:#dcfce7;color:#166534}
.badge-yellow{background:#fef3c7;color:#92400e}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-purple{background:#f3e8ff;color:#6b21a8}
.badge-gray{background:#f1f5f9;color:#475569}

/* Toolbar */
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filter-bar select,.filter-bar input{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.filter-bar label{font-size:12px;color:#64748b;white-space:nowrap}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-start;padding:30px 16px;overflow-y:auto}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:10px;max-width:760px;width:100%;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:14px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;border-radius:10px 10px 0 0;z-index:1}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{cursor:pointer;font-size:22px;color:#94a3b8;background:none;border:none;line-height:1}
.modal-close:hover{color:#dc2626}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end;gap:8px}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.form-group{display:flex;flex-direction:column}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:12px;color:#475569;margin-bottom:3px;font-weight:500}
.form-group label .req{color:#dc2626}
.form-group input,.form-group select,.form-group textarea{padding:7px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.form-group input.calc-field{background:#f0fdf4;font-weight:600;color:#16a34a}
.form-group .hint{font-size:11px;color:#94a3b8;margin-top:2px}

/* Today panel */
.today-panel{background:#fff;border-radius:8px;padding:14px 18px;margin-bottom:14px;border-left:4px solid #f59e0b;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.today-panel h3{font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.today-item{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;gap:10px}
.today-item:last-child{border-bottom:none}
.today-item .red{color:#dc2626;font-weight:600}
.today-empty{color:#94a3b8;font-size:13px;padding:6px 0}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:300;opacity:0;transform:translateY(20px);transition:all .3s;max-width:90vw}
.toast.show{opacity:1;transform:translateY(0)}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.chart-card{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chart-card h3{font-size:14px;margin-bottom:10px}
.chart-svg{width:100%;height:auto}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid #e2e8f0}
.tab{padding:8px 16px;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-2px;color:#64748b}
.tab.active{color:#2563eb;border-bottom-color:#2563eb;font-weight:600}

/* Empty */
.empty-state{text-align:center;padding:40px;color:#94a3b8}
.backup-notice{background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:10px 16px;margin-bottom:14px;font-size:13px;color:#92400e;display:flex;align-items:center;gap:8px}

/* Mobile */
.mobile-toggle{display:none;background:none;border:none;font-size:20px;cursor:pointer;color:#475569;padding:4px 8px}
@media(max-width:768px){
  #sidebar{transform:translateX(-100%)}
  #sidebar.show{transform:translateX(0)}
  #main{margin-left:0}
  .mobile-toggle{display:block}
  .form-grid{grid-template-columns:1fr}
  .chart-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:1fr 1fr}
  .topbar{padding:8px 12px}
  #content{padding:10px}
  .modal-overlay{padding:8px}
  .company-filter select{max-width:150px;font-size:12px}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:1fr}
}
@media print{
  #sidebar,.topbar,.toolbar,.modal-overlay,.filter-bar{display:none!important}
  #main{margin-left:0}
  #content{padding:0}
}

/* ====== 月度考勤表 ====== */
.attendance-sheet{border:1px solid #d6e0c8;border-radius:8px;background:#fff;overflow:hidden}
.attendance-sheet .sheet-header{background:linear-gradient(135deg,#8a9a6d,#6b7c5a);color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.attendance-sheet .sheet-header h2{margin:0;font-size:20px;font-weight:500;letter-spacing:1px}
.attendance-sheet .sheet-header .sub{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:2px;margin-top:4px}
.attendance-sheet .sheet-header .header-info{display:flex;gap:24px;align-items:center;flex-wrap:wrap;font-size:13px}
.attendance-sheet .sheet-header .header-info span{opacity:.9}
.attendance-sheet .sheet-header .header-info b{margin-left:4px;font-weight:600}
.month-tabs{display:flex;gap:4px;background:#f8faf6;padding:10px 14px;border-bottom:1px solid #d6e0c8;flex-wrap:wrap}
.month-tab{padding:5px 13px;border:1px solid #d6e0c8;background:#fff;border-radius:4px;cursor:pointer;font-size:13px;color:#4a5a3a;transition:all .15s}
.month-tab:hover{background:#eef5e0}
.month-tab.active{background:#8a9a6d;color:#fff;border-color:#8a9a6d}
.sheet-toolbar{display:flex;gap:8px;padding:10px 14px;background:#f8faf6;border-bottom:1px solid #d6e0c8;flex-wrap:wrap;align-items:center}
.sheet-toolbar .tool-label{font-size:12px;color:#64748b}
.sheet-summary{display:flex;gap:24px;padding:10px 16px;background:#f8faf6;border-bottom:1px solid #d6e0c8;font-size:13px;flex-wrap:wrap}
.sheet-summary label{color:#666}
.sheet-summary b{margin-left:4px;color:#333;font-weight:600}
.attendance-grid-wrap{overflow-x:auto;max-width:100%}
.attendance-grid{border-collapse:separate;border-spacing:0;font-size:12px;min-width:100%}
.attendance-grid th,.attendance-grid td{border:1px solid #d6e0c8;text-align:center;padding:0;height:34px;min-width:34px;box-sizing:border-box}
.attendance-grid thead th{background:#f1f5ec;color:#4a5a3a;font-weight:500;position:sticky;top:0;z-index:10}
.attendance-grid thead th.day-col{font-size:11px;padding:2px 0}
.attendance-grid thead th.day-col .dow{font-size:10px;color:#7a8a6a;display:block;margin-top:-2px}
.attendance-grid tbody td.emp-no,.attendance-grid tbody td.emp-name{background:#fff;position:sticky;left:0;z-index:5;font-weight:500}
.attendance-grid tbody td.emp-name{left:58px;z-index:5}
.attendance-grid thead th.emp-no,.attendance-grid thead th.emp-name{position:sticky;left:0;z-index:11;background:#f1f5ec}
.attendance-grid thead th.emp-name{left:58px}
.attendance-grid td.emp-no{min-width:58px;width:58px;color:#4a5a3a}
.attendance-grid td.emp-name{min-width:90px;width:90px;text-align:left;padding:0 8px}
.attendance-grid td.summary-col{min-width:48px;background:#f8fafb;font-weight:500;color:#334155}
.attendance-grid td.day-cell{cursor:pointer;background:#fff;transition:background .1s;position:relative}
.attendance-grid td.day-cell:hover{background:#eef5e0}
.attendance-grid td.day-cell.rest{background:#f0f4e8;color:#6b7c5a}
.attendance-grid td.day-cell.leave{background:#fff8e1;color:#8a6d0b}
.attendance-grid td.day-cell.absent{background:#fde8e8;color:#b91c1c}
.attendance-grid td.day-cell.warn{background:#fff7ed;color:#c2410c}
.attendance-grid td.day-cell.ok{color:#166534}
.attendance-grid td.day-cell.weekend{background:#fafafa}
.attendance-grid td.day-cell.out-of-month{background:#f1f5f0;cursor:default}
.attendance-grid td.day-cell .cell-text{display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.attendance-empty{padding:40px;text-align:center;color:#64748b;font-size:14px}
.cell-editor{padding:12px}
.cell-editor .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cell-editor .status-btn{padding:8px;border:1px solid #d6e0c8;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;transition:all .15s}
.cell-editor .status-btn:hover{background:#eef5e0;border-color:#8a9a6d}
.cell-editor .status-btn.active{background:#8a9a6d;color:#fff;border-color:#8a9a6d}
.cell-editor .status-clear{color:#dc2626;background:#fff;border:1px solid #fecaca}
.cell-editor .status-clear:hover{background:#fef2f2}
.login-screen{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1e3a5f,#2c5364);padding:20px}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:360px;padding:34px 28px;text-align:center;box-sizing:border-box}
.login-logo{font-size:24px;font-weight:700;color:#1e3a5f;margin-bottom:4px}
.login-sub{font-size:13px;color:#64748b;margin:0 0 24px}
.login-form .form-group{margin-bottom:14px;text-align:left}
.login-form label{display:block;font-size:13px;color:#334155;margin-bottom:6px}
.login-form input{width:100%;padding:12px 14px;font-size:16px;border:1px solid #d6e0e8;border-radius:10px;box-sizing:border-box;min-height:44px}
.login-form input:focus{outline:none;border-color:#2c5364}
.login-form .btn-login{width:100%;padding:14px;font-size:16px;background:#2c5364;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-top:8px;min-height:48px}
.login-form .btn-login:active{background:#1e3a5f}
.login-err{color:#dc2626;font-size:13px;min-height:18px;margin:0 0 8px}
.login-hint{font-size:12px;color:#94a3b8;margin-top:14px;line-height:1.5}
.logout-btn{margin-left:8px;background:#fff;border:1px solid #cbd5e1;color:#475569;border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer;min-height:40px}
.logout-btn:active{background:#f1f5f9}
.sample-badge{display:inline-block;background:#f59e0b;color:#fff;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:middle;font-weight:500}
</style>

<body>
<div id="loginScreen" class="login-screen"><div class="login-card"><div class="login-logo">供货管理</div><p class="login-sub">财务业务管理系统</p><div id="loginFormArea"></div></div></div>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>供货管理</h1>
      <p>财务业务管理系统</p>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-footer">
      <button onclick="exportAllBackup()">导出全部备份(JSON)</button>
      <button onclick="document.getElementById('fileInputAll').click()">导入恢复备份</button>
      <input type="file" id="fileInputAll" accept=".json" style="display:none" onchange="importAllBackup(event)">
      <button onclick="confirmClearAll()" style="border-color:#7f1d1d;background:#7f1d1d">清空全部数据</button>
      <button onclick="clearSampleData()" style="border-color:#b45309;background:#f59e0b;color:#fff">仅清除示例数据</button>
    </div>
  </aside>
  <main id="main">
    <header class="topbar">
      <div class="company-filter">
        <button class="mobile-toggle" onclick="toggleSidebar()">☰</button>
        <label>业务主体:</label>
        <select id="companyFilter" onchange="onCompanyChange()"></select>
      </div>
      <div class="header-actions">
        <span class="date-text" id="todayDate"></span>
        <span class="user-label" id="userLabel" style="display:none"></span>
        <button class="cloud-btn" onclick="openCloudSync()" title="云同步设置">☁ <span id="cloudStatus">未同步</span></button>
        <button class="logout-btn" id="logoutBtn" style="display:none" onclick="doLogout()">退出</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-card" id="modalCard"></div>
</div>
<input type="file" id="fileInput" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ====== 常量配置 ====== */
const COMPANIES = [
  "水发智慧服务有限公司（总部）",
  "水发智慧服务有限公司伊宁市分公司",
  "水发智慧服务有限公司北屯市分公司",
  "水发智慧服务建设有限公司",
  "水发智慧服务电力有限公司"
];

/* ====== 存储层：IndexedDB + 内存缓存 ======
   所有业务数据存入 IndexedDB（容量大、不占 5MB localStorage 限制）；
   读取走内存缓存 DB_CACHE（同步语义，调用点无需改）；写入异步镜像到 IDB。
   首次启动若 IndexedDB 为空但 localStorage 有 wb_erp_* 数据，自动迁移，避免丢数据。 */
const IDB_NAME="wb_erp_db", IDB_VER=1, IDB_STORE="kv";
let _idb=null, _idbReady=false;
const DB_CACHE={};
let _writeChain=Promise.resolve();
let _usageTimer=null;

function _openIDB(){
  return new Promise(resolve=>{
    if(typeof indexedDB==="undefined"){resolve(null);return;}
    let req;
    try{req=indexedDB.open(IDB_NAME,IDB_VER);}catch(e){resolve(null);return;}
    req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE,{keyPath:"k"});};
    req.onsuccess=e=>{_idb=e.target.result;resolve(_idb);};
    req.onerror=()=>{console.warn("IndexedDB 不可用，降级为内存模式（本会话有效）");resolve(null);};
  });
}
function _idbGet(k){return new Promise(resolve=>{if(!_idb){resolve(undefined);return;}try{const tx=_idb.transaction(IDB_STORE,"readonly");const rq=tx.objectStore(IDB_STORE).get(k);rq.onsuccess=()=>resolve(rq.result?rq.result.v:undefined);rq.onerror=()=>resolve(undefined);}catch(e){resolve(undefined);}});}
function _idbPut(k,v){return new Promise(resolve=>{if(!_idb){resolve();return;}try{const tx=_idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).put({k,v});tx.oncomplete=()=>resolve();tx.onerror=()=>resolve();}catch(e){resolve();}});}
function _idbDelete(k){return new Promise(resolve=>{if(!_idb){resolve();return;}try{const tx=_idb.transaction(IDB_STORE,"readwrite");tx.objectStore(IDB_STORE).delete(k);tx.oncomplete=()=>resolve();tx.onerror=()=>resolve();}catch(e){resolve();}});}
function _idbAllKeys(){return new Promise(resolve=>{if(!_idb){resolve([]);return;}try{const tx=_idb.transaction(IDB_STORE,"readonly");const rq=tx.objectStore(IDB_STORE).getAllKeys();rq.onsuccess=()=>resolve(Array.from(rq.result||[]));rq.onerror=()=>resolve([]);}catch(e){resolve([]);}});}
async function initStorage(){
  await _openIDB();
  const keys=await _idbAllKeys();
  for(const k of keys){try{DB_CACHE[k]=await _idbGet(k);}catch(e){}}
    if(keys.length===0 && typeof localStorage!=="undefined"){
    const pre="wb_erp_"; let migrated=0; const toRemove=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k && k.indexOf(pre)===0){
        let v; try{v=JSON.parse(localStorage.getItem(k));}catch(e){v=localStorage.getItem(k);}
        DB_CACHE[k]=v; toRemove.push(k);
        if(_idb){_writeChain=_writeChain.then(()=>_idbPut(k,v)).catch(()=>{});} migrated++;
      }
    }
    if(_idb){ toRemove.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}}); }
    if(migrated>0)console.log("已从 localStorage 迁移 "+migrated+" 条记录至 IndexedDB");
  }
  /* 初始化本地修改时间戳：若本地有数据但无时间戳，设为当前时间，防止云端空数据覆盖 */
  if(!DB_CACHE["wb_erp_local_changed_at"] && keys.length>0){
    DB_CACHE["wb_erp_local_changed_at"]=Date.now();
    if(_idb){_writeChain=_writeChain.then(()=>_idbPut("wb_erp_local_changed_at",Date.now())).catch(()=>{});}
  }
  _idbReady=true;
}

function _b64FromBuf(buf){let s="";const b=new Uint8Array(buf);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function _bufFromB64(b64){const s=atob(b64);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return b;}
async function _deriveKey(pass,salt){
  const enc=new TextEncoder();
  const km=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function cryptoEncrypt(obj,pass){
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await _deriveKey(pass,salt);
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj)));
  const buf=new Uint8Array(28+ct.byteLength);buf.set(salt,0);buf.set(iv,16);buf.set(new Uint8Array(ct),28);
  return _b64FromBuf(buf);
}
async function cryptoDecrypt(b64,pass){
  const buf=_bufFromB64(b64);
  const salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  const key=await _deriveKey(pass,salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

async function pullFromCloud(){
  const cfg=getCloudCfg();
  if(!cfg||!cfg.enabled||!cfg.url||!cfg.anonKey||!cfg.passphrase||!currentUser)return;
  const url=cfg.url.replace(/\/$/,"")+"/rest/v1/erp_data?id=eq.main%3A%3A"+encodeURIComponent(currentUser)+"&select=payload,updated_at";
  const res=await fetch(url,{headers:{"apikey":cfg.anonKey,"Authorization":"Bearer "+cfg.anonKey}});
  if(!res.ok)throw new Error("pull "+res.status);
  const rows=await res.json();
  if(!rows||!rows.length)return;
  const obj=await cryptoDecrypt(rows[0].payload,cfg.passphrase);
  if(obj&&obj.data){
    const cloudTs=obj.ts||0;
    const localChangedAt=Number(getFlag("wb_erp_local_changed_at")||0);
    /* 若云端标记仅有示例数据，绝不覆盖本地（防止早期示例数据覆盖用户真实数据） */
    const cloudHasReal=obj.hasReal===true;

      console.log("[云同步] 云端仅有示例数据，跳过覆盖（保留本地真实数据）");
      showToast("云端只有示例数据，未覆盖本地","info");
      return;
    }
    /* 仅当云端数据比本地更新时才覆盖，防止空云端覆盖本地数据 */
    if(cloudTs>localChangedAt){
      Object.entries(KEYS).forEach(([k,v])=>{

          DB_CACHE[rk]=obj.data[k];

    }else{
      console.log("[云同步] 云端数据不新于本地（cloud="+cloudTs+" local="+localChangedAt+"），跳过覆盖");
    }
  }
}

function parseCSV(text){
  text=text.replace(/^\ufeff/,"");
  const rows=[];let row=[];let field="";let q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++}else{q=false}}
      else field+=c;
    }else{
      if(c==='"')q=true;
      else if(c===","){row.push(field);field=""}
      else if(c==="\n"||c==="\r"){
        if(c==="\r"&&text[i+1]==="\n")i++;
        row.push(field);field="";rows.push(row);row=[];
      }else field+=c;
    }
  }
  if(field||row.length){row.push(field);rows.push(row)}
  return rows.filter(r=>r.length>0&&r.some(c=>c.trim()!==""));
}
function toCSV(rows){
  return rows.map(r=>r.map(c=>{
    const s=String(c===null||c===undefined?"":c);
    return s.includes(",")||s.includes('"')||s.includes("\n")?'"'+s.replace(/"/g,'""')+'"':s;
  }).join(",")).join("\r\n");
}
function downloadFile(filename,content,mime){
  const blob=new Blob(["\ufeff"+content],{type:mime||"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),100);
}
function exportCSV(key,filename,headers){
  const data=loadData(key);
  const rows=[headers].concat(data.map(r=>headers.map(h=>r[h]!==undefined?r[h]:"")));
  downloadFile(filename,toCSV(rows),"text/csv;charset=utf-8");
  showToast(`已导出 ${data.length} 条数据`,"success");
}
function downloadTemplate(filename,headers){
  const example=headers.map((_,i)=>"示例"+(i+1));
  downloadFile(filename,toCSV([headers,example]),"text/csv;charset=utf-8");
  showToast("模板已下载，请按格式填写后导入","success");
}
let importCallback=null;
function triggerImport(cb){
  importCallback=cb;
  $("#fileInput").click();
}
function handleFileInput(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const rows=parseCSV(e.target.result);
    if(rows.length<2){showToast("文件为空或格式错误","error");return}
    const headers=rows[0];
    const dataRows=rows.slice(1);
    const records=dataRows.map(r=>{
      const obj={id:genId("R")};
      headers.forEach((h,i)=>obj[h]=r[i]||"");
      return obj;
    });
    if(importCallback)importCallback(records);
    importCallback=null;
  };
  reader.readAsText(file,"UTF-8");
  event.target.value="";
}
$("#fileInput").addEventListener("change",handleFileInput);

/* ====== 通用表格渲染 ====== */
function renderDataTable(headers,data,colRenderer,actionsRenderer){
  if(!data||data.length===0){
    return `<div class="empty-state">暂无数据，点击「新增」或「导入」添加</div>`;
  }
  let html='<div class="table-wrap"><table class="data-table"><thead><tr>';
  headers.forEach(h=>html+=`<th>${h}</th>`);
  html+="</tr></thead><tbody>";
  data.forEach((row,i)=>{
    html+="<tr>";
    headers.forEach((h,hi)=>{
      let content=colRenderer?colRenderer(h,row,i):escapeHtml(row[h]);
      if(row._sample && hi===0)content='<span class="sample-badge">示例</span>'+content;
      html+=`<td>${content}</td>`;
    });
    if(actionsRenderer){
      html+=`<td class="text-center">${actionsRenderer(row)}</td>`;
    }
    html+="</tr>";
  });
  html+="</tbody></table></div>";
  return html;
}

function fmtBytes(b){
  b=Number(b)||0;
  if(b<1024)return b.toFixed(0)+" B";
  if(b<1048576)return (b/1024).toFixed(1)+" KB";
  if(b<1073741824)return (b/1048576).toFixed(2)+" MB";
  return (b/1073741824).toFixed(2)+" GB";
}
function updateStorageUsage(){
  const el=document.getElementById("storageUsage");
  if(!el)return;
  const labels={products:"商品档案",delivery:"送货单",returns:"退货单",settlement:"结算发票",retail:"零售台账",employees:"员工主档",attendance:"考勤记录",salary:"薪资记录"};
  let chips="",total=0;
  Object.keys(labels).forEach(k=>{
    const arr=DB_CACHE[ns(KEYS[k])];
    const n=Array.isArray(arr)?arr.length:0; total+=n;
    chips+=`<span style="display:inline-block;background:#eef2f7;border-radius:12px;padding:3px 10px;margin:3px 4px 3px 0;font-size:12px;color:#475569">${labels[k]} <b style="color:#0f172a">${n}</b></span>`;
  });
  chips+=`<span style="display:inline-block;background:#dcfce7;border-radius:12px;padding:3px 10px;margin:3px 4px 3px 0;font-size:12px;color:#166534">合计 <b>${total}</b> 条</span>`;
  el.innerHTML=
    `<div style="margin-bottom:10px">${chips}</div>`+
    `<div style="height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:6px"><div id="storageBar" style="height:100%;width:0%;background:linear-gradient(90deg,#2563eb,#16a34a);transition:width .4s"></div></div>`+
    `<div id="storageText" style="font-size:13px;color:#64748b">正在计算存储占用…</div>`;
  if(navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(res=>{
      const used=res.usage||0, quota=res.quota||0;
      const pct=quota>0?Math.min(100,(used/quota)*100):0;
      const bar=document.getElementById("storageBar");
      const txt=document.getElementById("storageText");
      if(bar)bar.style.width=pct.toFixed(2)+"%";
      if(txt)txt.innerHTML=`已用 <b style="color:#0f172a">${fmtBytes(used)}</b> / 可用 <b style="color:#0f172a">${fmtBytes(quota)}</b>　占比 ${pct.toFixed(2)}%`;
    }).catch(()=>{const t=document.getElementById("storageText");if(t)t.textContent="无法读取存储配额";});
  }else{
    const t=document.getElementById("storageText");if(t)t.textContent="当前浏览器不支持存储配额查询";
  }
}

function seedDeliveriesOnce(){
  const exist=loadData(KEYS.delivery);
  /* 若数据被清空但flag仍在，允许重新导入 */
  if(getFlag("deliveries_seeded") && exist.length>0)return;
  const seen=new Set(exist.map(d=>d["单据编号"]).filter(Boolean));
  const add=DELIVERY_SEED.filter(d=>{if(seen.has(d["单据编号"]))return false;seen.add(d["单据编号"]);return true;});
  if(add.length)saveData(KEYS.delivery,exist.concat(add));
  const existR=loadData(KEYS.returns);
  const seenR=new Set(existR.map(r=>r["单据编号"]).filter(Boolean));
  const addR=RETURNS_SEED.filter(r=>{if(seenR.has(r["单据编号"]))return false;seenR.add(r["单据编号"]);return true;});
  if(addR.length)saveData(KEYS.returns,existR.concat(addR));
  setFlag("deliveries_seeded","1");
  let msg=add.length?("已自动导入总部送货单 "+add.length+" 条"):"";
  if(addR.length)msg+=(msg?"，":"")+("退货单 "+addR.length+" 条");

function seedDianliDeliveriesOnce(){
  const exist=loadData(KEYS.delivery);
  if(getFlag("dianli_deliveries_seeded") && exist.length>0)return;
  const seen=new Set(exist.map(d=>d["单据编号"]).filter(Boolean));
  const add=DELIVERY_DL_SEED.filter(d=>{if(seen.has(d["单据编号"]))return false;seen.add(d["单据编号"]);return true;});
  if(add.length)saveData(KEYS.delivery,exist.concat(add));
  setFlag("dianli_deliveries_seeded","1");
  if(add.length)showToast("已自动导入电力送货单 "+add.length+" 条","success");
}


function seedYiningDeliveriesOnce(){
  const flag="yining_deliveries_v2";
  const exist=loadData(KEYS.delivery);
  if(getFlag(flag) && exist.length>0)return;
  const idx=new Map(exist.map((d,i)=>[d["单据编号"],i]));
  let changed=0;
  DELIVERY_YN_SEED.forEach(s=>{
    if(idx.has(s["单据编号"])){exist[idx.get(s["单据编号"])]=s;changed++;}
    else{exist.push(s);changed++;}
  });
  if(changed)saveData(KEYS.delivery,exist);
  setFlag(flag,"1");
  if(changed)showToast("已更新伊宁送货单（含运费列）"+changed+" 条","success");

function fixBeitunJuneFreightOnce(){
  if(getFlag("beitun_jun_freight_fixed_v1"))return;
  const all=loadData(KEYS.delivery);
  let changed=0;
  all.forEach(r=>{
    if(r["业务归属公司"]!=="水发智慧服务有限公司北屯市分公司")return;
    if(!(r["送货日期"]||"").startsWith("2026-06"))return;
    BT_JUN_FREIGHT_FIXES.forEach(f=>{
      const match=f.keys.some(k=>(r["商品名称"]||"").includes(k));
      if(r["送货日期"]===f.date && match){
        const oldP=r["发货件数"],oldF=r["运费"],oldS=r["运费小计"];
        r["发货件数"]=f.件;r["运费"]=f.运费;r["运费小计"]=f.运费小计;
        if(oldP!==f.件||oldF!==f.运费||oldS!==f.运费小计)changed++;
      }
    });
  });
  if(changed>0)saveData(KEYS.delivery,all);
  setFlag("beitun_jun_freight_fixed_v1","1");
  if(changed>0)showToast("已修正北屯6月运费 "+changed+" 条","success");
}

function renderDelivery(){
  let data=getFiltered(loadData(KEYS.delivery),"业务归属公司");
  const from=$("#dFrom")?$("#dFrom").value:"";
  const to=$("#dTo")?$("#dTo").value:"";
  const prod=$("#dProd")?$("#dProd").value:"";
  const store=$("#dStore")?$("#dStore").value:"";
  if(from)data=data.filter(r=>(r["送货日期"]||"")>=from);
  if(to)data=data.filter(r=>(r["送货日期"]||"")<=to);
  if(prod)data=data.filter(r=>(r["商品名称"]||"").includes(prod));
  if(store)data=data.filter(r=>(r["商超门店名称"]||"").includes(store));
  data.sort((a,b)=>(b["送货日期"]||"").localeCompare(a["送货日期"]||""));
  const headers=["业务归属公司","送货日期","商品名称","规格","单位","供货数量","成本单价","供货销售单价","单品毛利","毛利合计","发货件数","运费","运费小计","收货人","商超门店名称"];
  const el=$("#deliveryTable");
  if(el)el.innerHTML=renderDataTable(headers,data,
    (h,r)=>{
      if(h==="业务归属公司")return `<span class="badge badge-blue">${escapeHtml(r[h]||"")}</span>`;
      if(h==="单品毛利")return`<span class="profit-text">${fmtMoney(r[h])}</span>`;
      if(h==="毛利合计")return`<span class="profit-text">${fmtMoney(r[h])}</span>`;
      if(h==="供货数量")return fmtQty(r[h]);
      if(h==="发货件数")return fmtQty(r[h]);
      if(h==="成本单价"||h==="供货销售单价")return fmtMoney(r[h]);
      if(h==="运费小计")return fmtMoney(r[h]);
      return escapeHtml(r[h]||"");
    },
    r=>`<button class="btn btn-sm btn-secondary" onclick="openDeliveryForm('${r.id}')">编辑</button> <button class="btn btn-sm btn-outline" onclick="printDoc('delivery','${r.id}')">打印</button> <button class="btn btn-sm btn-danger" onclick="deleteRecord('${KEYS.delivery}','${r.id}')">删除</button>`
  );
}

    $("#f_规格").value=prod["规格"]||"";
    const u=$("#f_单位"); if(u&&prod["单位"])u.value=prod["单位"];
    $("#f_成本单价").value=prod["统一成本价"]||"";
    $("#f_供货销售单价").value=prod["商超供货售价"]||"";
    calcDelivery();
  }
}
function calcDelivery(){
  const cost=Number($("#f_成本单价").value)||0;
  const price=Number($("#f_供货销售单价").value)||0;
  const qty=Number($("#f_供货数量").value)||0;
  const margin=price-cost;
  $("#f_单品毛利").value=margin.toFixed(2);
  $("#f_毛利合计").value=(margin*qty).toFixed(2);
}
function saveDelivery(id){
  const fields=["业务归属公司","送货日期","商品名称","规格","单位","供货数量","成本单价","供货销售单价","单品毛利","毛利合计","发货件数","运费","运费小计","收货人","商超门店名称","备注"];
  if(!$("#f_商品名称").value||!$("#f_供货数量").value){
    showToast("请填写必填字段","error");return;
  }
  const obj={id:id||genId("D")};
  fields.forEach(f=>obj[f]=$("#f_"+f).value);
  let docNo=id?((data.find(x=>x.id===id)||{})["单据编号"]||""):"";
  if(!docNo)docNo="SH"+Date.now().toString().slice(-8);
  obj["单据编号"]=docNo;
  obj._type="delivery";
  const data=loadData(KEYS.delivery);
  if(id){
    const i=data.findIndex(x=>x.id===id);
    if(i>=0)data[i]=obj;
  }else data.push(obj);
  saveData(KEYS.delivery,data);
  closeModal();
  showToast("送货单保存成功","success");
  renderDelivery();
}

function seedCatalogOnce(){
  const existing=loadData(KEYS.products);
  if(getFlag("wb_erp_catalog_seeded") && existing.length>0)return;
  const seen=new Set(existing.map(p=>(p["商品名称"]||"")+"|"+(p["规格"]||"")));
  const add=CATALOG.filter(p=>{const k=(p["商品名称"]||"")+"|"+(p["规格"]||"");if(seen.has(k))return false;seen.add(k);return true;});
  if(add.length)saveData(KEYS.products,existing.concat(add));
  setFlag("wb_erp_catalog_seeded","1");
  if(add.length)showToast("已自动导入商品目录 "+add.length+" 条","success");
}

function autoCalcSettleAmt(){
  const company=$("#f_归属公司").value;
  const start=$("#f_批次开始日期").value;
  const end=$("#f_批次结束日期").value;
  if(!start||!end){showToast("请先选择开始和结束日期","error");return}
  if(start>end){showToast("开始日期不能晚于结束日期","error");return}
  const delivery=loadData(KEYS.delivery).filter(d=>d["业务归属公司"]===company && d["送货日期"]>=start && d["送货日期"]<=end);
  let total=0;
  delivery.forEach(d=>{
    total+=Number(d["供货销售单价"]||0)*Number(d["供货数量"]||0);
  });
  $("#f_对账金额").value=total.toFixed(2);
  if($("#f_对账周期").value && start.slice(0,7)===$("#f_对账周期").value){
    // 同周期无需处理
  } else if(start.slice(0,7)===end.slice(0,7)){
    $("#f_对账周期").value=start.slice(0,7);
  }
  calcSettlement();
  showToast(`已汇总 ${delivery.length} 笔送货单，金额 ${fmtMoney(total)}`,"success");
}
function calcSettlement(){
  const amt=Number($("#f_对账金额").value)||0;
  const inv=Number($("#f_已开票金额").value)||0;
  const pay=Number($("#f_甲方回款金额").value)||0;
  $("#f_未开票金额").value=(amt-inv).toFixed(2);
  $("#f_待结算余额").value=(amt-pay).toFixed(2);
}
function saveSettlement(id){
  const fields=["归属公司","对账周期","对账金额","已开票金额","未开票金额","发票号码","开票日期","甲方回款金额","回款日期","待结算余额","结算状态"];
  if(!$("#f_归属公司").value||!$("#f_对账金额").value){showToast("请填写必填字段","error");return}
  const obj={id:id||genId("S")};
  fields.forEach(f=>obj[f]=$("#f_"+f).value);
  // 对应送货批次：日期范围拼接
  const start=$("#f_批次开始日期")?$("#f_批次开始日期").value:"";
  const end=$("#f_批次结束日期")?$("#f_批次结束日期").value:"";
  if(start && end){
    obj["对应送货批次"]=start+" 至 "+end;
  } else {
    obj["对应送货批次"]=start||end||obj["对应送货批次"]||"";
  }
  const data=loadData(KEYS.settlement);
  if(id){const i=data.findIndex(x=>x.id===id);if(i>=0)data[i]=obj}
  else data.push(obj);
  saveData(KEYS.settlement,data);
  closeModal();
  showToast("结算台账保存成功","success");
  renderSettlement();
}

/* ========== 考勤辅助函数 ========== */
function daysInMonth(year,month){return new Date(Date.UTC(year,month,0)).getUTCDate()}
function monthFirstDay(year,month){return new Date(Date.UTC(year,month-1,1)).getUTCDay()}
function pad2(n){return String(n).padStart(2,"0")}
function ymStr(year,month){return year+"-"+pad2(month)}
function getEmployees(){
  const emps=loadData(KEYS.employees);
  // 仅在员工主档为空时，从考勤记录做一次迁移；之后由用户自行维护，避免删了的员工被重新加回
  if(emps.length===0){
    const names=[...new Set(loadData(KEYS.attendance).map(r=>r["员工姓名"]).filter(Boolean))];
    let maxNo=0;
    const migrated=names.map(n=>{maxNo++;const no=String(maxNo).padStart(3,"0");return{id:"E"+no+Math.random().toString(36).slice(2,6),工号:no,姓名:n};});
    if(migrated.length>0)saveData(KEYS.employees,migrated);
    return migrated;
  }
  return emps;
}
// 把考勤记录里出现、但主档里还没有的员工名补进主档（用于导入后立刻可见）
function addEmployeesFromNames(names){
  let emps=loadData(KEYS.employees);
  let maxNo=emps.reduce((m,e)=>{const n=parseInt(e["工号"])||0;return n>m?n:m;},0);
  let changed=false;
  names.forEach(n=>{
    n=String(n).trim();
    if(!n)return;
    if(!emps.some(e=>e["姓名"]===n)){
      maxNo++;
      const no=String(maxNo).padStart(3,"0");
      emps.push({id:"E"+no+Math.random().toString(36).slice(2,6),工号:no,姓名:n});
      changed=true;
    }
  });
  if(changed)saveData(KEYS.employees,emps);
}
function getAttendanceMap(empName,year,month){
  const ym=ymStr(year,month);
  const map={};
  loadData(KEYS.attendance).filter(r=>r["员工姓名"]===empName&&(r["考勤日期"]||"").startsWith(ym)).forEach(r=>{map[r["考勤日期"]]=r});
  return map;
}
function computeAttendanceSummary(empName,year,month,totalDays){
  const map=getAttendanceMap(empName,year,month);
  const s={缺勤:0,事假:0,病假:0,年假:0,出差:0,迟到:0,早退:0,休息:0,正常出勤:0,其他:0,应出勤:0,实际出勤:0};
  for(let d=1;d<=totalDays;d++){
    const date=ymStr(year,month)+"-"+pad2(d);
    const rec=map[date];
    const wd=new Date(Date.UTC(year,month-1,d)).getUTCDay();
    const isWeekend=(wd===0||wd===6);
    if(!isWeekend)s.应出勤++;
    if(!rec)continue;
    const st=rec["出勤状态"];
    if(st==="缺勤")s.缺勤++;
    else if(st==="事假"||st==="请假")s.事假++;
    else if(st==="病假")s.病假++;
    else if(st==="年假")s.年假++;
    else if(st==="出差")s.出差++;
    else if(st==="迟到")s.迟到++;
    else if(st==="早退")s.早退++;
    else if(st==="休息")s.休息++;
    else if(st==="正常出勤")s.正常出勤++;
    else s.其他++;
    if(st==="正常出勤"||st==="迟到"||st==="早退"||st==="出差")s.实际出勤++;
  }
  s.出勤率=s.应出勤>0?(s.实际出勤/s.应出勤*100):0;
  return s;
}

function renderAttendance(){
  const emps=getEmployees();
  const {year,month}=attendanceMonth;
  const total=daysInMonth(year,month);
  const firstWd=monthFirstDay(year,month);
  const dowLabels=["日","一","二","三","四","五","六"];

  let totalExpected=0,totalActual=0;
  emps.forEach(e=>{
    const s=computeAttendanceSummary(e.姓名,year,month,total);
    totalExpected+=s.应出勤;
    totalActual+=s.实际出勤;
  });

  let html=`<div class="attendance-grid-wrap"><table class="attendance-grid"><thead><tr>
    <th class="emp-no">工号</th><th class="emp-name">姓名</th>`;
  for(let d=1;d<=31;d++){
    if(d<=total){
      const wd=(firstWd+d-1)%7;
      const isWeekend=(wd===0||wd===6);
      html+=`<th class="day-col ${isWeekend?'weekend':''}">${d}<span class="dow">${dowLabels[wd]}</span></th>`;
    }else{
      html+=`<th class="day-col out-of-month">${d}<span class="dow">-</span></th>`;

  html+=`<th class="summary-col">缺勤</th><th class="summary-col">事假</th><th class="summary-col">病假</th><th class="summary-col">出差</th><th class="summary-col">年假</th><th class="summary-col">操作</th></tr></thead><tbody>`;

  }else{
    emps.forEach(e=>{
      const map=getAttendanceMap(e.姓名,year,month);
      const s=computeAttendanceSummary(e.姓名,year,month,total);
      html+=`<tr>
        <td class="emp-no">${escapeHtml(e.工号||"")}</td>
        <td class="emp-name">${e._sample?'<span class="sample-badge">示例</span>':''}${escapeHtml(e.姓名||"")}</td>`;
      for(let d=1;d<=31;d++){
        if(d<=total){
          const date=ymStr(year,month)+"-"+pad2(d);
          const wd=(firstWd+d-1)%7;
          const isWeekend=(wd===0||wd===6);
          const rec=map[date];
          const st=rec?rec["出勤状态"]:"";
          const cls=st?ATTEND_CLASS[st]||"":(isWeekend?"weekend":"");
          const text=st?ATTEND_SHORT[st]:"";
          html+=`<td class="day-cell ${cls}" onclick="openAttendanceCellForm('${e.工号}','${date}')" title="${escapeHtml(st||'点击登记')}">${text?`<span class="cell-text">${text}</span>`:''}</td>`;
        }else{
          html+=`<td class="day-cell out-of-month"></td>`;
        }
      }
      html+=`<td class="summary-col">${s.缺勤||''}</td>
        <td class="summary-col">${s.事假||''}</td>
        <td class="summary-col">${s.病假||''}</td>
        <td class="summary-col">${s.出差||''}</td>
        <td class="summary-col">${s.年假||''}</td>
        <td class="summary-col">
          <button class="btn btn-sm btn-secondary" onclick="openEmployeeForm('${e.id}')">编辑</button>
          <button class="btn btn-sm btn-danger" onclick="deleteEmployeeMonth('${e.id}','${(e.姓名||"").replace(/'/g,"\\'")}')" title="仅删除该员工当前月份的考勤记录，其它月份保留">删当月</button>
        </td>
      </tr>`;
    });
  }
  html+=`</tbody></table></div>`;

  const el=$("#attendanceTable");
  if(el)el.innerHTML=html;

  const expEl=$("#aExpected");if(expEl)expEl.textContent=totalExpected;
  const rateEl=$("#aRate");if(rateEl)rateEl.textContent=(totalExpected>0?(totalActual/totalExpected*100):0).toFixed(1);

function saveEmployee(id){
  const no=$("#f_工号").value.trim();
  const name=$("#f_姓名").value.trim();
  if(!no||!name){showToast("请填写工号和姓名","error");return}
  const emps=loadData(KEYS.employees);
  if(id){
    const i=emps.findIndex(x=>x.id===id);
    if(i>=0){emps[i].工号=no;emps[i].姓名=name}
  }else{
    if(emps.some(e=>e.工号===no)){showToast("工号已存在","error");return}
    emps.push({id:genId("E"),工号:no,姓名:name});
  }
  saveData(KEYS.employees,emps);
  closeModal();
  showToast("员工保存成功","success");
  renderAttendance();
}
function deleteEmployeeMonth(id,name){
  // 优先按 id 查找，找不到则按姓名兜底（考勤记录本身以姓名为键，姓名更稳定）
  let emp=getEmployees().find(e=>e.id===id);
  if(!emp&&name)emp=getEmployees().find(e=>e.姓名===name);
  const empName=emp?emp.姓名:name;
  if(!empName){showToast("员工不存在","error");return}
  const {year,month}=attendanceMonth;
  const ym=ymStr(year,month);
  confirmDialog(`确定删除【${empName}】在 ${year}年${month}月 的考勤记录吗？\n其它月份不受影响（适用于离职、调岗等情况）。`,()=>{
    const data=loadData(KEYS.attendance).filter(r=>!(r["员工姓名"]===empName&&(r["考勤日期"]||"").startsWith(ym)));
    saveData(KEYS.attendance,data);
    // 若该员工在所有月份都已无考勤记录，则从主档移除，使该员工行从考勤表中消失
    const remain=loadData(KEYS.attendance).filter(r=>r["员工姓名"]===empName);
    if(remain.length===0){
      const emps=loadData(KEYS.employees).filter(e=>e.姓名!==empName);
      saveData(KEYS.employees,emps);
    }
    showToast(`已删除 ${empName} ${year}年${month}月 考勤记录`,"success");
    renderAttendance();
  },true);
}
function deleteEmployee(id,name){
  let emp=getEmployees().find(e=>e.id===id);
  if(!emp&&name)emp=getEmployees().find(e=>e.姓名===name);
  const empName=emp?emp.姓名:name;
  if(!empName){showToast("员工不存在","error");return}
  confirmDialog(`确定将【${empName}】从员工主档彻底删除吗？\n该员工所有月份的考勤记录将一并移除，且不可恢复。`,()=>{
    const emps=loadData(KEYS.employees).filter(e=>e.id!==id&&e.姓名!==empName);
    saveData(KEYS.employees,emps);
    const data=loadData(KEYS.attendance).filter(r=>r["员工姓名"]!==empName);
    saveData(KEYS.attendance,data);
    showToast("员工已彻底删除（含全部月份记录）","success");
    renderAttendance();
  },true);
}

function saveAttendanceCell(empNo,date,status){
  const emp=loadData(KEYS.employees).find(e=>e.工号===empNo);
  if(!emp)return;
  const data=loadData(KEYS.attendance);
  const idx=data.findIndex(r=>r["员工姓名"]===emp.姓名&&r["考勤日期"]===date);
  const isLeave=["事假","病假","年假","婚假","产假","调休","其他","请假"].includes(status);
  const obj={
    id:idx>=0?data[idx].id:genId("A"),
    员工姓名:emp.姓名,
    考勤日期:date,
    出勤状态:status,
    加班时长:"0",
    请假类型:isLeave?status:"无",
    请假天数:isLeave?"1":"0"
  };
  if(idx>=0)data[idx]=obj;else data.push(obj);
  saveData(KEYS.attendance,data);
  closeModal();
  showToast("考勤登记成功","success");
  renderAttendance();
}
function clearAttendanceCell(empNo,date){
  const emp=loadData(KEYS.employees).find(e=>e.工号===empNo);
  if(!emp)return;
  const data=loadData(KEYS.attendance).filter(r=>!(r["员工姓名"]===emp.姓名&&r["考勤日期"]===date));
  saveData(KEYS.attendance,data);
  closeModal();
  showToast("已清除","success");
  renderAttendance();
}
function fillMonthAttendance(empNo,year,month,status){
  confirmDialog(`确定将该员工${year}年${month}月所有日期设为「${status}」？已有记录会被覆盖。`,()=>{
  const emp=loadData(KEYS.employees).find(e=>e.工号===empNo);
  if(!emp)return;
  const data=loadData(KEYS.attendance).filter(r=>!(r["员工姓名"]===emp.姓名&&r["考勤日期"].startsWith(ymStr(year,month))));
  const isLeave=["事假","病假","年假","婚假","产假","调休","其他","请假"].includes(status);
  const total=daysInMonth(year,month);
  for(let d=1;d<=total;d++){
    data.push({
      id:genId("A"),
      员工姓名:emp.姓名,
      考勤日期:ymStr(year,month)+"-"+pad2(d),
      出勤状态:status,
      加班时长:"0",
      请假类型:isLeave?status:"无",
      请假天数:isLeave?"1":"0"
    });
  }
  saveData(KEYS.attendance,data);
  closeModal();
  showToast("批量填充完成","success");
  renderAttendance();
  },true);
}

/* ========== 模块:统计报表 ========== */
function reportsHTML(){
  return `<div id="viewReports">
    <div class="card">
      <div class="card-title">统计报表中心</div>
      <div class="filter-bar">
        <label>时间从:</label><input type="date" id="rpFrom" onchange="renderReports()">
        <label>到:</label><input type="date" id="rpTo" onchange="renderReports()">
        <label>主体公司:</label><select id="rpCompany" onchange="renderReports()"><option value="">跟随全局</option>${COMPANIES.map(c=>`<option value="${c}">${c}</option>`).join("")}</select>
        <label>商品:</label><input type="text" id="rpProd" placeholder="商品名称" oninput="renderReports()" style="width:100px">
        <label>汇总:</label><select id="rpMode" onchange="renderReports()"><option value="monthly">月度汇总</option><option value="yearly">年度汇总</option></select>
      </div>
    </div>
    <div id="reportContent"></div>
  </div>`;
}
function renderReports(){
  const global=$("#companyFilter").value;
  const override=$("#rpCompany")?$("#rpCompany").value:"";
  const company=override||global;
  const from=$("#rpFrom")?$("#rpFrom").value:"";
  const to=$("#rpTo")?$("#rpTo").value:"";
  const prod=$("#rpProd")?$("#rpProd").value:"";
  const mode=$("#rpMode")?$("#rpMode").value:"monthly";

  let delivery=loadData(KEYS.delivery);
  let returns=loadData(KEYS.returns);
  let retail=loadData(KEYS.retail);
  let settle=loadData(KEYS.settlement);
  if(company!=="all"){
    delivery=delivery.filter(d=>d["业务归属公司"]===company);
    returns=returns.filter(r=>r["业务归属公司"]===company);
    retail=retail.filter(r=>r["业务归属公司"]===company);
    settle=settle.filter(s=>s["归属公司"]===company);
  }
  if(from){
    delivery=delivery.filter(d=>(d["送货日期"]||"")>=from);
    returns=returns.filter(r=>(r["退货日期"]||"")>=from);
    retail=retail.filter(r=>(r["订单日期"]||"")>=from);
    settle=settle.filter(s=>(s["对账周期"]||"")>=from.slice(0,7));
  }
  if(to){
    delivery=delivery.filter(d=>(d["送货日期"]||"")<=to);
    returns=returns.filter(r=>(r["退货日期"]||"")<=to);
    retail=retail.filter(r=>(r["订单日期"]||"")<=to);
    settle=settle.filter(s=>(s["对账周期"]||"")<=to.slice(0,7));
  }
  if(prod){
    delivery=delivery.filter(d=>(d["商品名称"]||"").includes(prod));
    returns=returns.filter(r=>(r["商品名称"]||"").includes(prod));
    retail=retail.filter(r=>(r["商品"]||"").includes(prod));
  }

  let html="";

  // Section 1: 总销售金额与总利润（概览）
  let supRev=0,supCost=0,supProf=0;
  delivery.forEach(d=>{supRev+=Number(d["供货销售单价"]||0)*Number(d["供货数量"]||0);supCost+=Number(d["成本单价"]||0)*Number(d["供货数量"]||0);supProf+=Number(d["毛利合计"]||0)});
  returns.forEach(r=>{supRev-=Number(r["销售单价"]||0)*Number(r["退货数量"]||0);supCost-=Number(r["成本单价"]||0)*Number(r["退货数量"]||0);supProf-=Number(r["退货毛利冲减"]||0)});
  let onRev=0,onCost=0,onProf=0,gbRev=0,gbCost=0,gbProf=0;
  retail.forEach(r=>{const a=Number(r["销售额"]||0),c=Number(r["成本"]||0),p=Number(r["毛利"]||0);if(r["业务类型"]==="线上零售"){onRev+=a;onCost+=c;onProf+=p}else{gbRev+=a;gbCost+=c;gbProf+=p}});
  const netRev=supRev+onRev+gbRev;
  const netCost=supCost+onCost+gbCost;
  const netProf=supProf+onProf+gbProf;
  const netRate=netRev>0?(netProf/netRev*100):0;
  html+=`<div class="card"><div class="card-title">总销售金额与总利润（概览）</div>`;
  html+=`<div class="kpi-grid">`;
  html+=`<div class="kpi-card"><div class="kpi-label">总销售金额</div><div class="kpi-value">${fmtMoney(netRev)}</div><div class="kpi-sub">商超供货+线上零售+礼盒</div></div>`;
  html+=`<div class="kpi-card"><div class="kpi-label">总成本</div><div class="kpi-value">${fmtMoney(netCost)}</div></div>`;
  html+=`<div class="kpi-card profit"><div class="kpi-label">总利润（毛利）</div><div class="kpi-value profit-text">${fmtMoney(netProf)}</div></div>`;
  html+=`<div class="kpi-card pending"><div class="kpi-label">利润率</div><div class="kpi-value">${netRate.toFixed(1)}%</div></div>`;
  html+=`</div></div>`;


  // Report 3: Invoice summary
  const settleData=COMPANIES.filter(c=>company==="all"||c===company).map(c=>{
    const cs=settle.filter(s=>s["归属公司"]===c);
    let total=0,invoiced=0,uninvoiced=0,paid=0,pending=0;
    cs.forEach(s=>{
      total+=Number(s["对账金额"]||0);
      invoiced+=Number(s["已开票金额"]||0);
      paid+=Number(s["甲方回款金额"]||0);
    });
    uninvoiced=total-invoiced;
    pending=total-paid;
    return{c,total,invoiced,uninvoiced,paid,pending,count:cs.length};
  });
  html+=`<div class="card"><div class="card-title">发票台账汇总（每家公司应收/已开票/未开票/已回款/待回款）</div>`;
  html+=renderDataTable(["主体公司","结算笔数","应收总额","已开票","未开票","已回款","待回款"],settleData,
    (h,r)=>{
      if(h==="主体公司")return escapeHtml(r.c);
      if(h==="结算笔数")return r.count;
      if(h.includes("额")||h.includes("票")||h.includes("款"))return fmtMoney(r[h==="应收总额"?"total":h==="已开票"?"invoiced":h==="未开票"?"uninvoiced":h==="已回款"?"paid":"pending"]);
      return"";
    }
  );
  html+="</div>";

  // Report 4: Product summary
  const productMap={};
  delivery.forEach(d=>{
    const key=mode==="monthly"?((d["送货日期"]||"").slice(0,7)+"|"+d["商品名称"]):((d["送货日期"]||"").slice(0,4)+"|"+d["商品名称"]);
    if(!productMap[key])productMap[key]={period:(d["送货日期"]||"").slice(0,mode==="monthly"?7:4),product:d["商品名称"],qty:0,retQty:0,cost:0,rev:0,prof:0};
    productMap[key].qty+=Number(d["供货数量"]||0);
    productMap[key].cost+=Number(d["成本单价"]||0)*Number(d["供货数量"]||0);
    productMap[key].rev+=Number(d["供货销售单价"]||0)*Number(d["供货数量"]||0);
    productMap[key].prof+=Number(d["毛利合计"]||0);
  });
  returns.forEach(r=>{

    productMap[key].retQty+=Number(r["退货数量"]||0);
    productMap[key].cost-=Number(r["成本单价"]||0)*Number(r["退货数量"]||0);
    productMap[key].rev-=Number(r["销售单价"]||0)*Number(r["退货数量"]||0);
    productMap[key].prof-=Number(r["退货毛利冲减"]||0);
  });
  const prodArr=Object.values(productMap).map(p=>({...p,effQty:p.qty-p.retQty,rate:p.rev>0?(p.prof/p.rev*100):0})).sort((a,b)=>b.effQty-a.effQty||(b.period+"|"+b.product).localeCompare(a.period+"|"+a.product));
  html+=`<div class="card"><div class="card-title">商品${mode==="monthly"?"月度":"年度"}汇总（总供货/退货/有效销售/成本/营收/毛利/利润率）</div>`;
  if(prodArr.length===0){
    html+=`<div class="empty-state">暂无数据，请在送货单/退货单中录入数据</div>`;
  }else{
    html+=renderDataTable(["周期","商品名称","总供货量","退货量","有效销量","总成本","总营收","总毛利","利润率"],prodArr,
      (h,r)=>{
        if(h==="商品名称")return escapeHtml(r.product);
        if(h==="周期")return r.period;
        if(h==="总供货量")return fmtQty(r.qty);
        if(h==="退货量")return fmtQty(r.retQty);
        if(h==="有效销量")return fmtQty(r.effQty);
        if(h==="总成本")return fmtMoney(r.cost);
        if(h==="总营收")return fmtMoney(r.rev);
        if(h==="总毛利")return`<span class="profit-text">${fmtMoney(r.prof)}</span>`;
        if(h==="利润率")return r.rate.toFixed(1)+"%";
        return"";
      }
    );
  }
  html+="</div>";


  const el=$("#reportContent");
  if(el)el.innerHTML=html;
}

/* ========== SVG图表函数 ========== */
function svgLineChart(data,w,h){
  const padL=50,padR=15,padT=20,padB=40;
  const cw=w-padL-padR,ch=h-padT-padB;
  if(!data||data.length===0)return '<div class="empty-state">暂无数据</div>';
  const vals=data.flatMap(d=>[d.rev,d.prof]);
  const maxV=Math.max(...vals,1);
  const minV=Math.min(...vals,0);
  const range=maxV-minV||1;
  const stepX=data.length>1?cw/(data.length-1):cw;
  const scaleY=v=>padT+ch-((v-minV)/range)*ch;
  const scaleX=i=>padL+i*stepX;
  const revPts=data.map((d,i)=>`${scaleX(i)},${scaleY(d.rev)}`).join(" ");
  const profPts=data.map((d,i)=>`${scaleX(i)},${scaleY(d.prof)}`).join(" ");
  let gridLines="";
  for(let i=0;i<=4;i++){
    const y=padT+(ch/4)*i;
    const val=maxV-(range/4)*i;
    gridLines+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
    gridLines+=`<text x="${padL-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${val>=1000?(val/1000).toFixed(1)+"k":val.toFixed(0)}</text>`;
  }
  let xLabels=data.map((d,i)=>`<text x="${scaleX(i)}" y="${h-10}" text-anchor="middle" font-size="10" fill="#64748b">${d.month}</text>`).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    <polyline points="${revPts}" fill="none" stroke="#2563eb" stroke-width="2"/>
    <polyline points="${profPts}" fill="none" stroke="#16a34a" stroke-width="2"/>
    ${data.map((d,i)=>`<circle cx="${scaleX(i)}" cy="${scaleY(d.rev)}" r="3" fill="#2563eb"/>`).join("")}
    ${data.map((d,i)=>`<circle cx="${scaleX(i)}" cy="${scaleY(d.prof)}" r="3" fill="#16a34a"/>`).join("")}
    ${xLabels}
    <rect x="${w-110}" y="${padT}" width="12" height="3" fill="#2563eb"/><text x="${w-92}" y="${padT+6}" font-size="11" fill="#475569">营收</text>
    <rect x="${w-60}" y="${padT}" width="12" height="3" fill="#16a34a"/><text x="${w-42}" y="${padT+6}" font-size="11" fill="#475569">毛利</text>
  </svg>`;
}
function svgDonut(data,w,h){
  const cx=w/2,cy=h/2;
  const r=Math.min(w,h)/2-30;
  const innerR=r*0.55;
  const total=data.reduce((s,d)=>s+Math.max(0,d.val),0);
  if(total===0)return '<div class="empty-state">暂无数据</div>';
  let angle=-Math.PI/2;
  let paths="";
  let labels="";
  data.forEach((d,i)=>{
    const val=Math.max(0,d.val);
    if(val===0)return;
    const frac=val/total;
    const pct=(frac*100).toFixed(1);
    if(frac>=0.9999){
      // 100% 占比：path 圆弧会退化，改用两个 circle 组成完整圆环
      paths+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${d.color}" opacity="0.85"/>`;
      paths+=`<circle cx="${cx}" cy="${cy}" r="${innerR}" fill="#ffffff"/>`;
    }else{
      const endA=angle+frac*Math.PI*2;
      const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
      const x2=cx+r*Math.cos(endA),y2=cy+r*Math.sin(endA);
      const xi1=cx+innerR*Math.cos(angle),yi1=cy+innerR*Math.sin(angle);
      const xi2=cx+innerR*Math.cos(endA),yi2=cy+innerR*Math.sin(endA);
      const large=frac>0.5?1:0;
      paths+=`<path d="M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${xi2} ${yi2} A ${innerR} ${innerR} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${d.color}" opacity="0.85"/>`;
      const lx=cx+(r+15)*Math.cos((angle+endA)/2);
      const ly=cy+(r+15)*Math.sin((angle+endA)/2);
      labels+=`<text x="${lx}" y="${ly}" text-anchor="middle" font-size="10" fill="#475569">${pct}%</text>`;
      angle=endA;
    }
  });
  const legendH=data.filter(d=>d.val>0).length*14;
  const legendY=Math.max(h-24, cy+r+14);
  let legendI=0;
  const legend=data.map((d,i)=>{
    if(d.val<=0)return "";
    const y=legendY+legendI*14;legendI++;
    return `<rect x="${10}" y="${y}" width="10" height="10" fill="${d.color}" rx="2"/><text x="${26}" y="${y+9}" font-size="10" fill="#475569">${d.label} ${fmtMoney(d.val)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
    ${paths}${labels}${legend}
    <text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="11" fill="#64748b">总计</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">${fmtMoney(total)}</text>
  </svg>`;
}
function svgBarChart(data,w,h){
  const padL=50,padR=15,padT=20,padB=50;
  const cw=w-padL-padR,ch=h-padT-padB;
  if(!data||data.length===0)return '<div class="empty-state">暂无数据</div>';
  const maxV=Math.max(...data.map(d=>Math.max(d.val,d.prof||0)),1);
  const barW=cw/data.length*0.35;
  const gap=cw/data.length;
  let grid="";
  for(let i=0;i<=4;i++){
    const y=padT+(ch/4)*i;
    const val=maxV-(maxV/4)*i;
    grid+=`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
    grid+=`<text x="${padL-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#94a3b8">${val>=1000?(val/1000).toFixed(1)+"k":val.toFixed(0)}</text>`;
  }
  let bars=data.map((d,i)=>{
    const x=padL+i*gap+gap*0.15;
    const revH=(d.val/maxV)*ch;
    const profH=((d.prof||0)/maxV)*ch;
    return `<rect x="${x}" y="${padT+ch-revH}" width="${barW}" height="${revH}" fill="#2563eb" opacity="0.85" rx="2"/>
      <rect x="${x+barW+2}" y="${padT+ch-profH}" width="${barW}" height="${profH}" fill="#16a34a" opacity="0.85" rx="2"/>
      <text x="${x+barW}" y="${h-15}" text-anchor="middle" font-size="9" fill="#64748b">${d.label.length>6?d.label.slice(0,6):d.label}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg" xmlns="http://www.w3.org/2000/svg">
    ${grid}${bars}
    <rect x="${w-90}" y="${padT}" width="10" height="10" fill="#2563eb" rx="2"/><text x="${w-74}" y="${padT+8}" font-size="10" fill="#475569">营收</text>
    <rect x="${w-50}" y="${padT}" width="10" height="10" fill="#16a34a" rx="2"/><text x="${w-34}" y="${padT+8}" font-size="10" fill="#475569">毛利</text>
  </svg>`;
}

const ACCOUNTS_KEY="wb_erp_accounts";

async function sha256(s){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}
function isAuthed(){return sessionStorage.getItem("wb_erp_user")!=null;}

}
async function doRegister(){
  const u=$("#rg_user").value.trim(), p=$("#rg_pass").value, p2=$("#rg_pass2").value;
  const err=$("#loginErr");
  if(!u||!p){err.textContent="请填写用户名和密码";return;}
  if(p.length<6){err.textContent="密码至少6位";return;}
  if(p!==p2){err.textContent="两次密码不一致";return;}
  let acc=getAccounts();
  if(acc.find(a=>a.user===u)){err.textContent="该用户名已存在，请直接登录";return;}
  acc.push({user:u,passHash:await sha256(p),role:"user"});
  saveAccounts(acc);
  currentUser=u; enterApp();
}
async function doLogin(){
  const u=$("#lg_user").value.trim(), p=$("#lg_pass").value;
  const err=$("#loginErr");
  const acc=getAccounts().find(a=>a.user===u);
  if(!acc||acc.passHash!==await sha256(p)){err.textContent="用户名或密码错误";return;}
  currentUser=u; enterApp();
}
function enterApp(){
  sessionStorage.setItem("wb_erp_user",currentUser);
  $("#loginScreen").style.display="none";
  const lb=$("#logoutBtn"); if(lb)lb.style.display="";
  const ul=$("#userLabel"); if(ul){ul.style.display="";ul.textContent="当前账号："+currentUser;}
  startApp();
}
function doLogout(){
  sessionStorage.removeItem("wb_erp_user");
  currentUser=null;
  const lb=$("#logoutBtn"); if(lb)lb.style.display="none";
  const ul=$("#userLabel"); if(ul)ul.style.display="none";
  showLoginScreen();
}
function migrateGlobalToAdmin(){
  if(currentUser!==ADMIN_USER)return;
  let need=false;
  Object.values(KEYS).forEach(v=>{ if(DB_CACHE[v]!==undefined && DB_CACHE[v+"::"+ADMIN_USER]===undefined) need=true; });
  if(!need)return;
  Object.values(KEYS).forEach(v=>{
    const rk=v+"::"+ADMIN_USER;
    if(DB_CACHE[rk]===undefined && DB_CACHE[v]!==undefined){
      DB_CACHE[rk]=DB_CACHE[v];
      if(_idb){_writeChain=_writeChain.then(()=>_idbPut(rk,DB_CACHE[v])).catch(()=>{});}
      delete DB_CACHE[v]; _idbDelete(v);
    }
  });
  showToast("已把历史数据迁移到管理员账号「"+ADMIN_USER+"」","success");
}

function importRealAttendance(){
  if(getFlag("real_attendance_v1"))return;
  /* Replace sample employees with real data */
  saveData(KEYS.employees, REAL_EMPLOYEES);
  /* Merge real attendance (replace sample records) */
  const existing=loadData(KEYS.attendance).filter(r=>!r._sample);
  const seen=new Set(existing.map(r=>r["员工姓名"]+r["考勤日期"]));
  const add=REAL_ATTENDANCE.filter(r=>{
    const k=r["员工姓名"]+r["考勤日期"];
    if(seen.has(k))return false; seen.add(k); return true;
  });
  saveData(KEYS.attendance, existing.concat(add));
  setFlag("real_attendance_v1","1");
  if(add.length>0)showToast("已导入真实考勤数据 "+add.length+" 条","success");
}
async function startApp(){
  if(currentUser===ADMIN_USER) migrateGlobalToAdmin();
  try{ await initCloudSync(); }catch(e){ console.warn("云同步初始化失败",e); }
  if(currentUser===ADMIN_USER){
    initSampleData();
    seedCatalogOnce();
    seedDeliveriesOnce();
    seedYiningDeliveriesOnce();
    seedDianliDeliveriesOnce();
    seedJiansheDeliveriesOnce();
    seedJiansheReturnsOnce();
    seedBeitunDeliveriesOnce();
    seedBeitunReturnsOnce();
    cleanupErrantJiangRow();
    cleanupErrantJulyRecord();
    importRealAttendance();
    fixBeitunJuneFreightOnce();
  }
  renderSidebar();
  initCompanyFilter();
  $("#todayDate").textContent="今天: "+todayStr();
  renderView("dashboard");
}
async function init(){
  await initStorage();
  ADMIN_HASH=await sha256(ADMIN_PASS);
  ensureAdmin();
  const su=sessionStorage.getItem("wb_erp_user");
  if(su){ currentUser=su; startApp(); return; }
  showLoginScreen();
}
init();
